<body><div id="container">
<header class="site-header"><h1>Hubungi Saya</h1><p>Halaman kontak</p></header>

<section id="hero"><h2>Contact</h2><p>Silakan isi formulir berikut sebagai contoh form kontak.</p></section>
<main class="page-content">
  <form class="contact-form" action="#" method="post">
    <label for="nama">Nama</label><input id="nama" name="nama" type="text" placeholder="Masukkan nama" required>
    <label for="email">Email</label><input id="email" name="email" type="email" placeholder="nama@email.com" required>
    <label for="message">Pesan</label><textarea id="message" name="message" rows="5" placeholder="Tulis pesan Anda..." required></textarea>
    <button type="submit">Kirim Pesan</button>
    <p class="form-note">Demo tampilan: formulir belum terhubung ke server untuk mengirim pesan.</p>
  </form>
</main>
